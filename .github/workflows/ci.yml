name: CI

on:
  push:
    branches: [main, chore/base-setup]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Run all style and formatting checks
        run: |
          uv run pre-commit run --all-files

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Run tests with coverage
        run: |
          uv run pytest

      - name: Generate coverage badge
        id: badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          OLD=$(cat .github/badges/coverage.svg 2>/dev/null || echo "")
          uv run python3 .github/scripts/generate_badge.py -o .github/badges/coverage.svg -f
          NEW=$(cat .github/badges/coverage.svg)
          if [ "$OLD" != "$NEW" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.badge.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          git commit -m "chore: обновить бейдж покрытия кода [skip ci]"
          git push
