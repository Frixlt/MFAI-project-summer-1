[project]
name = "Project-summer-1"
version = "0.0.1"
description = "Постквантовый обмен ключами и гибридное шифрование"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.14"
authors = [
  { name = "Максим Бердников", email = "m.berdnikov@innopolis.university" },
]
dependencies = []

[project.optional-dependencies]
lint = ["ruff>=0.11", "pre-commit>=4.0"]
test = ["pytest>=8.0", "pytest-cov>=4.1", "coverage-badge>=1.1.0"]
notebook = ["ipykernel>=6.29.0", "notebook>=7.1.0"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".venv", "__pycache__", ".git", "build", "dist"]

[tool.ruff.lint]
select = [
  "E",
  "W",    # pycodestyle
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "B",    # bugbear
  "A",    # builtins
  "C4",   # comprehensions
  "T20",  # print
  "RET",  # return
  "PTH",  # pathlib
  "ERA",  # eradicate
  "COM",  # commas
  "Q",    # quotes
  "UP",   # pyupgrade
  "SIM",  # simplify
  "TC",   # type-checking
  "PERF", # performance
  "FURB", # refurb
  "LOG",  # logging
  "DTZ",  # datetime timezone
  "RUF",  # ruff-specific rules
]
ignore = ["COM812"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/*" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = []
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]
extraPaths = ["."]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
